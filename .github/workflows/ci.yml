name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Train candidate models with local MLflow tracking
        run: python scripts/train_model.py

      - name: Generate monitoring artifacts
        run: python scripts/generate_mlops_artifacts.py

      - name: Generate Evidently drift report
        run: python scripts/generate_evidently_report.py

      - name: Run unit tests
        run: pytest -q

      - name: Validate Docker Compose observability stack
        run: docker compose config
